<svg xmlns="http://www.w3.org/2000/svg" width="1408" height="624" viewBox="0 0 1408 624"><rect width="1408" height="624" fill="#ffffff"/><text x="36.0" y="34.0" font-family="Arial, Helvetica, sans-serif" font-size="17.5" font-weight="bold" font-style="normal" fill="#111111" text-anchor="start">The inferential chain from exposure to policy benefit</text><text x="36.0" y="57.0" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" font-style="normal" fill="#555555" text-anchor="start">Each link carries a different grade of evidence. Only the premise, at left, is well supported.</text><line x1="36.0" y1="76.0" x2="1372.0" y2="76.0" stroke="#c9c9c9" stroke-width="1"/><rect x="36.0" y="84.0" width="262.0" height="160.0" rx="3" fill="#ebebeb" stroke="#111111" stroke-width="1.4"/><text x="51.0" y="111.0" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" font-style="normal" fill="#555555" text-anchor="start" letter-spacing="1.4">PREMISE</text><text x="51.0" y="135.0" font-family="Arial, Helvetica, sans-serif" font-size="12.5" font-weight="normal" font-style="normal" fill="#111111" text-anchor="start">Heavier social media use is</text><text x="51.0" y="151.0" font-family="Arial, Helvetica, sans-serif" font-size="12.5" font-weight="normal" font-style="normal" fill="#111111" text-anchor="start">prospectively associated with more</text><text x="51.0" y="167.0" font-family="Arial, Helvetica, sans-serif" font-size="12.5" font-weight="normal" font-style="normal" fill="#111111" text-anchor="start">depressive symptoms in adolescents.</text><line x1="51.0" y1="184.0" x2="283.0" y2="184.0" stroke="#8c8c8c" stroke-width="0.9"/><text x="51.0" y="202.0" font-family="Arial, Helvetica, sans-serif" font-size="11.2" font-weight="normal" font-style="normal" fill="#555555" text-anchor="start">Cohort, ages 12-19 y. Risk difference,</text><text x="51.0" y="216.0" font-family="Arial, Helvetica, sans-serif" font-size="11.2" font-weight="normal" font-style="normal" fill="#555555" text-anchor="start">6.3 per 100 (95% CI, 2.7-9.9) for &gt;2 h</text><text x="51.0" y="230.0" font-family="Arial, Helvetica, sans-serif" font-size="11.2" font-weight="normal" font-style="normal" fill="#555555" text-anchor="start">vs &lt;1 h daily use.</text><line x1="308.0" y1="162.0" x2="404.0" y2="162.0" stroke="#8c8c8c" stroke-width="1.4" stroke-dasharray="5 4"/><path d="M 347.0 153.0 L 365.0 171.0" stroke="#111111" stroke-width="2"/><path d="M 365.0 153.0 L 347.0 171.0" stroke="#111111" stroke-width="2"/><text x="356.0" y="142.0" font-family="Arial, Helvetica, sans-serif" font-size="11.5" font-weight="normal" font-style="italic" fill="#555555" text-anchor="middle">does not imply</text><rect x="414.0" y="110.0" width="190.0" height="104.0" rx="3" fill="#ffffff" stroke="#111111" stroke-width="1.5"/><text x="509.0" y="159.0" font-family="Arial, Helvetica, sans-serif" font-size="12.5" font-weight="normal" font-style="normal" fill="#111111" text-anchor="middle">Restriction policy is</text><text x="509.0" y="175.0" font-family="Arial, Helvetica, sans-serif" font-size="12.5" font-weight="normal" font-style="normal" fill="#111111" text-anchor="middle">enacted</text><rect x="670.0" y="110.0" width="190.0" height="104.0" rx="3" fill="#ffffff" stroke="#111111" stroke-width="1.5"/><text x="765.0" y="159.0" font-family="Arial, Helvetica, sans-serif" font-size="12.5" font-weight="normal" font-style="normal" fill="#111111" text-anchor="middle">Young people's actual use</text><text x="765.0" y="175.0" font-family="Arial, Helvetica, sans-serif" font-size="12.5" font-weight="normal" font-style="normal" fill="#111111" text-anchor="middle">falls</text><rect x="926.0" y="110.0" width="190.0" height="104.0" rx="3" fill="#ffffff" stroke="#111111" stroke-width="1.5"/><text x="1021.0" y="159.0" font-family="Arial, Helvetica, sans-serif" font-size="12.5" font-weight="normal" font-style="normal" fill="#111111" text-anchor="middle">Falling use improves</text><text x="1021.0" y="175.0" font-family="Arial, Helvetica, sans-serif" font-size="12.5" font-weight="normal" font-style="normal" fill="#111111" text-anchor="middle">mental health</text><rect x="1182.0" y="110.0" width="190.0" height="104.0" rx="3" fill="#ffffff" stroke="#111111" stroke-width="1.5"/><text x="1277.0" y="151.0" font-family="Arial, Helvetica, sans-serif" font-size="12.5" font-weight="normal" font-style="normal" fill="#111111" text-anchor="middle">Population benefit: fewer</text><text x="1277.0" y="167.0" font-family="Arial, Helvetica, sans-serif" font-size="12.5" font-weight="normal" font-style="normal" fill="#111111" text-anchor="middle">depressive episodes, less</text><text x="1277.0" y="183.0" font-family="Arial, Helvetica, sans-serif" font-size="12.5" font-weight="normal" font-style="normal" fill="#111111" text-anchor="middle">self-harm, fewer suicides</text><text x="36.0" y="300.0" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" font-style="normal" fill="#555555" text-anchor="start" letter-spacing="1.4">WHY THE DISTINCTION MATTERS</text><text x="36.0" y="326.0" font-family="Arial, Helvetica, sans-serif" font-size="11.8" font-weight="normal" font-style="normal" fill="#111111" text-anchor="start">The premise concerns an exposure contrast of hours per</text><text x="36.0" y="341.5" font-family="Arial, Helvetica, sans-serif" font-size="11.8" font-weight="normal" font-style="normal" fill="#111111" text-anchor="start">day, estimated observationally. The chain concerns what a</text><text x="36.0" y="357.0" font-family="Arial, Helvetica, sans-serif" font-size="11.8" font-weight="normal" font-style="normal" fill="#111111" text-anchor="start">law achieves. Policy debate has largely treated these as</text><text x="36.0" y="372.5" font-family="Arial, Helvetica, sans-serif" font-size="11.8" font-weight="normal" font-style="normal" fill="#111111" text-anchor="start">one claim.</text><text x="36.0" y="398.5" font-family="Arial, Helvetica, sans-serif" font-size="11.2" font-weight="normal" font-style="normal" fill="#555555" text-anchor="start">A policy can be no better evidenced than the weakest link it</text><text x="36.0" y="413.0" font-family="Arial, Helvetica, sans-serif" font-size="11.2" font-weight="normal" font-style="normal" fill="#555555" text-anchor="start">depends on. Here that link has never been examined.</text><line x1="611.0" y1="162.0" x2="654.0" y2="162.0" stroke="#111111" stroke-width="1.7"/><path d="M 663.0 162.0 L 653.0 156.5 L 653.0 167.5 Z" fill="#111111"/><text x="637.0" y="147.0" font-family="Arial, Helvetica, sans-serif" font-size="10.5" font-weight="bold" font-style="normal" fill="#555555" text-anchor="middle" letter-spacing="1.1">LINK 1</text><line x1="637.0" y1="176.0" x2="637.0" y2="268.0" stroke="#c9c9c9" stroke-width="1" stroke-dasharray="3 4"/><rect x="515.0" y="276.0" width="244.0" height="238.0" rx="3" fill="#fafafa" stroke="#c9c9c9" stroke-width="1"/><text x="530.0" y="300.0" font-family="Arial, Helvetica, sans-serif" font-size="12.5" font-weight="bold" font-style="normal" fill="#111111" text-anchor="start">Does the policy reduce use?</text><rect x="530.0" y="316.0" width="11.0" height="11.0" rx="1.5" fill="#111111" stroke="#111111" stroke-width="1.1"/><rect x="546.0" y="316.0" width="11.0" height="11.0" rx="1.5" fill="#111111" stroke="#111111" stroke-width="1.1"/><rect x="562.0" y="316.0" width="11.0" height="11.0" rx="1.5" fill="#111111" stroke="#111111" stroke-width="1.1"/><text x="530.0" y="347.0" font-family="Arial, Helvetica, sans-serif" font-size="11.2" font-weight="bold" font-style="normal" fill="#111111" text-anchor="start">Tested. Effect near zero.</text><line x1="530.0" y1="359.0" x2="744.0" y2="359.0" stroke="#c9c9c9" stroke-width="0.9"/><text x="530.0" y="377.0" font-family="Arial, Helvetica, sans-serif" font-size="10.8" font-weight="normal" font-style="normal" fill="#555555" text-anchor="start">Korea, difference-in-differences, n ≈</text><text x="530.0" y="390.0" font-family="Arial, Helvetica, sans-serif" font-size="10.8" font-weight="normal" font-style="normal" fill="#555555" text-anchor="start">244 000: −3.6 min/d in year 1,</text><text x="530.0" y="403.0" font-family="Arial, Helvetica, sans-serif" font-size="10.8" font-weight="normal" font-style="normal" fill="#555555" text-anchor="start">decaying to zero by year 3, with no</text><text x="530.0" y="416.0" font-family="Arial, Helvetica, sans-serif" font-size="10.8" font-weight="normal" font-style="normal" fill="#555555" text-anchor="start">change in internet addiction or sleep.</text><text x="530.0" y="429.0" font-family="Arial, Helvetica, sans-serif" font-size="10.8" font-weight="normal" font-style="normal" fill="#555555" text-anchor="start">Australia, regression discontinuity:</text><text x="530.0" y="442.0" font-family="Arial, Helvetica, sans-serif" font-size="10.8" font-weight="normal" font-style="normal" fill="#555555" text-anchor="start">&gt;85% of under-16s still using</text><text x="530.0" y="455.0" font-family="Arial, Helvetica, sans-serif" font-size="10.8" font-weight="normal" font-style="normal" fill="#555555" text-anchor="start">restricted platforms at 3 months.</text><text x="530.0" y="468.0" font-family="Arial, Helvetica, sans-serif" font-size="10.8" font-weight="normal" font-style="normal" fill="#555555" text-anchor="start">England, 30 schools: lower use during</text><text x="530.0" y="481.0" font-family="Arial, Helvetica, sans-serif" font-size="10.8" font-weight="normal" font-style="normal" fill="#555555" text-anchor="start">school hours, no difference in total</text><text x="530.0" y="494.0" font-family="Arial, Helvetica, sans-serif" font-size="10.8" font-weight="normal" font-style="normal" fill="#555555" text-anchor="start">use.</text><line x1="867.0" y1="162.0" x2="910.0" y2="162.0" stroke="#111111" stroke-width="1.7"/><path d="M 919.0 162.0 L 909.0 156.5 L 909.0 167.5 Z" fill="#111111"/><text x="893.0" y="147.0" font-family="Arial, Helvetica, sans-serif" font-size="10.5" font-weight="bold" font-style="normal" fill="#555555" text-anchor="middle" letter-spacing="1.1">LINK 2</text><line x1="893.0" y1="176.0" x2="893.0" y2="268.0" stroke="#c9c9c9" stroke-width="1" stroke-dasharray="3 4"/><rect x="771.0" y="276.0" width="244.0" height="238.0" rx="3" fill="#fafafa" stroke="#c9c9c9" stroke-width="1"/><text x="786.0" y="300.0" font-family="Arial, Helvetica, sans-serif" font-size="12.5" font-weight="bold" font-style="normal" fill="#111111" text-anchor="start">Does reduced use improve mental</text><text x="786.0" y="316.0" font-family="Arial, Helvetica, sans-serif" font-size="12.5" font-weight="bold" font-style="normal" fill="#111111" text-anchor="start">health?</text><rect x="786.0" y="332.0" width="11.0" height="11.0" rx="1.5" fill="#111111" stroke="#111111" stroke-width="1.1"/><rect x="802.0" y="332.0" width="11.0" height="11.0" rx="1.5" fill="#ffffff" stroke="#9a9a9a" stroke-width="1.1"/><rect x="818.0" y="332.0" width="11.0" height="11.0" rx="1.5" fill="#ffffff" stroke="#9a9a9a" stroke-width="1.1"/><text x="786.0" y="363.0" font-family="Arial, Helvetica, sans-serif" font-size="11.2" font-weight="bold" font-style="normal" fill="#111111" text-anchor="start">Association only. Not tested at</text><text x="786.0" y="377.0" font-family="Arial, Helvetica, sans-serif" font-size="11.2" font-weight="bold" font-style="normal" fill="#111111" text-anchor="start">policy scale.</text><line x1="786.0" y1="389.0" x2="1000.0" y2="389.0" stroke="#c9c9c9" stroke-width="0.9"/><text x="786.0" y="407.0" font-family="Arial, Helvetica, sans-serif" font-size="10.8" font-weight="normal" font-style="normal" fill="#555555" text-anchor="start">Prospective cohorts establish the</text><text x="786.0" y="420.0" font-family="Arial, Helvetica, sans-serif" font-size="10.8" font-weight="normal" font-style="normal" fill="#555555" text-anchor="start">association and its age gradient.</text><text x="786.0" y="433.0" font-family="Arial, Helvetica, sans-serif" font-size="10.8" font-weight="normal" font-style="normal" fill="#555555" text-anchor="start">Experimental reduction trials are</text><text x="786.0" y="446.0" font-family="Arial, Helvetica, sans-serif" font-size="10.8" font-weight="normal" font-style="normal" fill="#555555" text-anchor="start">short, small, and largely in older</text><text x="786.0" y="459.0" font-family="Arial, Helvetica, sans-serif" font-size="10.8" font-weight="normal" font-style="normal" fill="#555555" text-anchor="start">samples. No policy evaluation to date</text><text x="786.0" y="472.0" font-family="Arial, Helvetica, sans-serif" font-size="10.8" font-weight="normal" font-style="normal" fill="#555555" text-anchor="start">has reported a mental health effect.</text><line x1="1123.0" y1="162.0" x2="1166.0" y2="162.0" stroke="#111111" stroke-width="1.7"/><path d="M 1175.0 162.0 L 1165.0 156.5 L 1165.0 167.5 Z" fill="#111111"/><text x="1149.0" y="147.0" font-family="Arial, Helvetica, sans-serif" font-size="10.5" font-weight="bold" font-style="normal" fill="#555555" text-anchor="middle" letter-spacing="1.1">LINK 3</text><line x1="1149.0" y1="176.0" x2="1149.0" y2="268.0" stroke="#c9c9c9" stroke-width="1" stroke-dasharray="3 4"/><rect x="1027.0" y="276.0" width="244.0" height="238.0" rx="3" fill="#fafafa" stroke="#c9c9c9" stroke-width="1"/><text x="1042.0" y="300.0" font-family="Arial, Helvetica, sans-serif" font-size="12.5" font-weight="bold" font-style="normal" fill="#111111" text-anchor="start">Is the achievable reduction</text><text x="1042.0" y="316.0" font-family="Arial, Helvetica, sans-serif" font-size="12.5" font-weight="bold" font-style="normal" fill="#111111" text-anchor="start">large enough to matter?</text><rect x="1042.0" y="332.0" width="11.0" height="11.0" rx="1.5" fill="#ffffff" stroke="#9a9a9a" stroke-width="1.1"/><rect x="1058.0" y="332.0" width="11.0" height="11.0" rx="1.5" fill="#ffffff" stroke="#9a9a9a" stroke-width="1.1"/><rect x="1074.0" y="332.0" width="11.0" height="11.0" rx="1.5" fill="#ffffff" stroke="#9a9a9a" stroke-width="1.1"/><text x="1042.0" y="363.0" font-family="Arial, Helvetica, sans-serif" font-size="11.2" font-weight="bold" font-style="normal" fill="#111111" text-anchor="start">Not addressed.</text><line x1="1042.0" y1="375.0" x2="1256.0" y2="375.0" stroke="#c9c9c9" stroke-width="0.9"/><text x="1042.0" y="393.0" font-family="Arial, Helvetica, sans-serif" font-size="10.8" font-weight="normal" font-style="normal" fill="#555555" text-anchor="start">The exposure contrast in the cohort</text><text x="1042.0" y="406.0" font-family="Arial, Helvetica, sans-serif" font-size="10.8" font-weight="normal" font-style="normal" fill="#555555" text-anchor="start">evidence is hours per day. The largest</text><text x="1042.0" y="419.0" font-family="Arial, Helvetica, sans-serif" font-size="10.8" font-weight="normal" font-style="normal" fill="#555555" text-anchor="start">reduction any evaluated policy has</text><text x="1042.0" y="432.0" font-family="Arial, Helvetica, sans-serif" font-size="10.8" font-weight="normal" font-style="normal" fill="#555555" text-anchor="start">produced is minutes per day. Whether</text><text x="1042.0" y="445.0" font-family="Arial, Helvetica, sans-serif" font-size="10.8" font-weight="normal" font-style="normal" fill="#555555" text-anchor="start">that magnitude could move a symptom</text><text x="1042.0" y="458.0" font-family="Arial, Helvetica, sans-serif" font-size="10.8" font-weight="normal" font-style="normal" fill="#555555" text-anchor="start">scale has, to our knowledge, never</text><text x="1042.0" y="471.0" font-family="Arial, Helvetica, sans-serif" font-size="10.8" font-weight="normal" font-style="normal" fill="#555555" text-anchor="start">been formally addressed.</text><line x1="36.0" y1="548.0" x2="1372.0" y2="548.0" stroke="#c9c9c9" stroke-width="1"/><text x="36.0" y="573.0" font-family="Arial, Helvetica, sans-serif" font-size="12.5" font-weight="bold" font-style="normal" fill="#111111" text-anchor="start">Of 13 policies inventoried, 1 was enacted with a prespecified evaluation. Of 5 published evaluations, none reported a suicide or self-harm outcome.</text><text x="36.0" y="594.0" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="normal" font-style="normal" fill="#8c8c8c" text-anchor="start">Filled squares indicate the evidence available for that link: 3 of 3, tested with an informative result; 1 of 3, association only; 0 of 3, not addressed.</text></svg>
# ---------------------------------------------------------------------------
# Table 3: research priorities. Ordered by what could be started this year.
# ---------------------------------------------------------------------------
priorities:
  - rank: 1
    question: >-
      Do school phone restrictions change adolescent mental health, and does
      the effect depend on restriction intensity?
    design: >-
      Staggered-adoption difference-in-differences across US states, with
      event-study specification and intensity coding
    data: >-
      Youth Risk Behavior Surveillance System; state administrative and
      disciplinary records; existing statute effective dates
    outcomes: Depressive symptoms, suicidal ideation, suicide attempt, absenteeism
    feasibility: >-
      High. Data already collected. Principal constraint is time: the
      counterfactual disappears as adoption saturates.
    cost: Low
    timeline: 12-18 months

  - rank: 2
    question: >-
      Does restriction improve mental health only when the vacated time is
      filled, ie, is the mechanism displacement?
    design: >-
      Three-arm cluster-randomized trial: restriction alone, restriction plus
      funded offline activity, usual practice
    data: Primary collection; schools or municipalities as clusters
    outcomes: >-
      Validated wellbeing and depressive symptom scales, self-harm, device use,
      physical activity, sleep
    feasibility: >-
      Moderate. Sweden's policy supplies the intervention design; no such trial
      has been registered.
    cost: High
    timeline: 3-4 years

  - rank: 3
    question: >-
      Does a national minimum-age law change mental health, as distinct from
      account ownership?
    design: >-
      Extend the existing Australian regression discontinuity to mental health
      endpoints, with a synthetic control from comparable non-adopting countries
    data: >-
      Australian cohort already assembled; national self-harm presentation and
      mortality data
    outcomes: Depressive symptoms, self-harm presentations, suicide
    feasibility: >-
      High for symptoms, moderate for self-harm, low for suicide within one
      jurisdiction.
    cost: Low to moderate
    timeline: 12-24 months

  - rank: 4
    question: >-
      Can any of these policies detect an effect on suicide or self-harm at
      plausible effect sizes?
    design: >-
      Coordinated multi-jurisdiction pooled analysis with prespecified
      harmonized outcome ascertainment; power analysis published in advance
    data: >-
      National mortality and emergency presentation registries across adopting
      and non-adopting jurisdictions
    outcomes: Suicide death, self-harm presentation
    feasibility: >-
      Moderate. No single jurisdiction has the events; the barrier is
      coordination, not method.
    cost: Moderate
    timeline: 3-5 years

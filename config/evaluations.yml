      belonging for girls, the group the policies most often invoke.
    suicide_outcome: false
    powered_for_mental_health: not_reported
    preregistered: not_reported
    direction: null_effect_with_adverse_signal
    verified_from: PubMed efetch abstract, PMID 41499073

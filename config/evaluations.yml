  - policy_id: KOR-2011-SHUTDOWN
    jurisdiction: South Korea
    policy_short: Online game curfew (midnight to 6 AM), under-16s
    pmid: null
    doi: "10.1287/mksc.2019.1174"
    year: 2020
    journal: Marketing Science
    design: difference_in_differences
    design_label: >-
      Difference-in-differences with regression discontinuity at age 16 and
      propensity score matching, on individual game-server logs
    data_source: Operator play-time and spending logs, not self-report
    n_analysed: null
    n_note: "individual gamer logs; heavy = top 20% by prior play"
    outcomes_measured:
      - device_use_behaviour
    outcome_primary: Total play time, minutes, and spending
    effect_text: >-
      Light gamers (bottom 80%) −108.752 min (P < .01). Heavy gamers (top 20%)
      +0.173 min, ie, no effect. Within the treatment group, heavy gamers lost
      154.9 and 41.1 min in the two curfew slots but gained 20.9, 69.8, 70.1,
      74.3 and 37.6 min across the daytime and evening slots, a net increase.
      Spending did not change.
    secondary_text: >-
      THE CENTRAL DISPLACEMENT RESULT. The law removed play from the restricted
      hours and heavy users moved more minutes into unrestricted hours than
      they lost. The effect direction flips in exactly the group the law was
      written to protect.
    suicide_outcome: false
    powered_for_mental_health: not_applicable
    preregistered: "no"
    direction: target_behaviour_displaced
    verified_from: Full text, Tables 2 and 3
    verified: true


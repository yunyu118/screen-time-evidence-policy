# Published evaluations of policies and environmental interventions affecting
# young people's screen, social media, or online gaming use.
#
# This file is the source of Table 2. Every numeric value here was read from the
# indexed abstract or full text of the cited record, not from press coverage or
# from a secondary citation. `verified_from` records where the numbers came
# from, so a coauthor or reviewer can re-check them without repeating the
# search.
#
# The columns are chosen to make one comparison easy: what the policy was meant
# to change, versus what was actually measured. In most rows those are not the
# same thing, and that gap is the paper's argument in tabular form.


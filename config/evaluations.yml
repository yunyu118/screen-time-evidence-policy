# ---------------------------------------------------------------------------
# The strongest available evidence on the exposure-outcome link the policies
# are justified by. Kept separate from policy evaluations on purpose: this is
# evidence about the premise, not about the remedy.
# ---------------------------------------------------------------------------
riskfactor_anchor:
  - pmid: "42274377"
    year: 2026
    journal: Med J Aust
    design: prospective_cohort
    design_label: Population-based prospective cohort, ages 12-19 y
    n_analysed: 1195
    exposure_contrast: ">2 h vs <1 h daily social media use"
    effects:
      - outcome: High depressive symptoms at next annual wave
        estimate: "Risk difference, 6.3 per 100 (95% CI, 2.7-9.9)"
      - outcome: Poor wellbeing
        estimate: "Risk difference, 4.9 per 100 (95% CI, 1.1-8.6)"
      - outcome: High depressive symptoms, girls aged 12-13 y
        estimate: "Risk difference, 10.8 per 100 (95% CI, 2.7-18.9)"
    verified_from: PubMed efetch abstract, PMID 42274377
    verified: true

# ---------------------------------------------------------------------------
# Causal-design studies of the exposure and SUICIDE specifically. Kept apart
# from the symptom-scale cohort evidence because suicide is the outcome
# invoked most often in advocacy for these laws, and because the designs
# capable of addressing it do not agree.
# ---------------------------------------------------------------------------
suicide_causal_designs:
  - doi: "10.1111/nyas.70016"
    year: 2025
    journal: Annals of the New York Academy of Sciences
    design: instrumental_variable
    design_label: >-
      Two-stage least squares using the quasi-exogenous geographic adoption of
      Twitter, instrumented by attendance at the 2007 SXSW festival
    unit: US counties
    finding: >-
      No significant relationship between Twitter adoption and suicide rates,
      controlling for geographic, socioeconomic, and demographic factors
    direction: "null"
    verified_from: Full text
    verified: true

  - doi: "10.1016/j.jad.2024.01.126"
    year: 2024
    journal: Journal of Affective Disorders
    design: mendelian_randomization
    design_label: Bidirectional two-sample Mendelian randomization
    unit: UK Biobank, Neale Lab, FinnGen
    finding: >-
      No effect of duration of digital device use on suicide risk. In the
      reverse direction, suicide risk was positively associated with length of
      mobile phone use, which is consistent with reverse causation.
    direction: reverse_causation
    verified_from: Full text
    verified: true

  - pmid: "42291422"
    year: 2026
    journal: PeerJ
    design: systematic_review
    design_label: >-
      Systematic review of smartphone addiction and suicidal ideation or
      attempt, PubMed/Embase/Web of Science/Cochrane to August 2025
    unit: 11 studies, 9 in South Korea, 1 China, 1 United States
    finding: >-
      Consistent positive associations with suicidal ideation, odds ratios 1.14
      to 4.57 in high-risk users, and with suicide attempt, 1.15 to 1.87.
      ALL ELEVEN INCLUDED STUDIES ARE CROSS-SECTIONAL. The exposure is
      addictive use, not duration.
    direction: association_cross_sectional_only
    verified_from: PubMed efetch abstract, PMID 42291422
    verified: true

  - doi: "10.1016/j.jhealeco.2025.103014"
    year: 2025
    journal: Journal of Health Economics
    design: instrumental_variable
    design_label: Fiber-optic rollout instrument with administrative hospital records
    unit: Spain
    finding: >-
      Increases in behavioral and mental health diagnoses among adolescents,
      concentrated among girls, including hospital-recorded self-harm or
      suicide attempt and suicide mortality
    direction: harm
    verified_from: Undermind report synthesis
    verified: false

  - doi: "10.2139/ssrn.4082581"
    year: 2025
    journal: Journal of Health Economics
